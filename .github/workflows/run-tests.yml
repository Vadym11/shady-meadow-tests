name: Shady Meadow Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel previous run if there are new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: karate-api/pom.xml

      - name: Run Karate tests
        working-directory: karate-api
        run: mvn test

      - name: Upload Karate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Use unique names
          name: karate-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            karate-api/target/karate-reports/
            karate-api/target/cucumber-html-reports/

  playwright:
    runs-on: ubuntu-latest
    needs: karate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: playwright-ui/package-lock.json

      - name: Install dependencies
        working-directory: playwright-ui
        run: npm ci 

      - name: Get Playwright version
        id: playwright-version
        working-directory: playwright-ui
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: playwright-ui
        run: npx playwright install --with-deps

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: playwright-ui
        run: npx playwright install-deps

      - name: Run Playwright tests
        working-directory: playwright-ui
        run: npx playwright test
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Use unique names
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-ui/playwright-report/